<rect width="1200" height="630" fill="#050505"/><rect width="1200" height="630" fill="url(#g)"/>
<g transform="translate(110 150)"><rect x="0" y="120" width="170" height="64" rx="32" fill="#FAFAFA"/><rect x="0" y="210" width="270" height="64" rx="32" fill="#F4D438"/><rect x="0" y="300" width="370" height="64" rx="32" fill="#FAFAFA"/><circle cx="56" cy="44" r="40" fill="#F4D438"/></g>
