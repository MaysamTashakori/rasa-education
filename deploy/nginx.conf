server {
  listen 80;
  server_name _;
  root /srv/web;
  index index.html;
  charset utf-8;
  gzip on;
  gzip_types text/html text/css application/javascript application/json application/manifest+json image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  types { application/manifest+json webmanifest; }

  location = /sw.js { add_header Cache-Control "no-cache" always; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache" always; }
  location = /rasa-planner.html {
    root /srv;
    add_header Content-Disposition 'attachment; filename="rasa-planner.html"' always;
  }
  location = /healthz { access_log off; return 200 "ok\n"; }
  location / { try_files $uri $uri/ /index.html; }
}
