:root{--f:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;--r:22px;
--bg:#060B22;--ink:#F1F4FF;--ink2:#CBD3F2;--mute:#A3ACD3;--line:rgba(150,172,255,.16);--line2:rgba(160,182,255,.30);
--card:linear-gradient(155deg,rgba(92,120,255,.16) 0%,rgba(13,22,58,.86) 45%,rgba(9,15,42,.9) 72%,rgba(176,92,255,.12) 100%);
--card2:rgba(130,155,255,.08);--glow:#FFB547;--live:linear-gradient(120deg,#FFE08A 0%,#FFB547 30%,#FF7E5F 62%,#E35DFF 100%);
--ok:#4BE6A8;--bad:#FF6378;--warn:#FFC765;--cyan:#4BE8E2;--violet:#B9A0FF;--grid:rgba(160,180,255,.18);
--h0:rgba(150,172,255,.09);--h1:#3b2f7a;--h2:#7b4fd6;--h3:#e35dff;--h4:#FFB547;
--shadow:inset 0 1px 0 rgba(190,205,255,.12),0 18px 44px -20px rgba(2,4,20,.85),0 0 60px -30px rgba(120,110,255,.45);
--nav:rgba(10,16,44,.82);color-scheme:dark}
:root[data-theme=light]{--bg:#F3F5FA;--ink:#121624;--ink2:#2E3446;--mute:#525A6E;--line:rgba(22,32,60,.10);--line2:rgba(22,32,60,.20);
--card:linear-gradient(180deg,#FFFFFF 0%,#FBFCFE 100%);--card2:#EEF1F7;--glow:#C9590A;--live:linear-gradient(135deg,#F28C2A 0%,#D9680C 55%,#A9470A 100%);
--ok:#0F7A55;--bad:#C22E22;--warn:#A8650F;--cyan:#0B7C79;--violet:#5A3FCF;--grid:rgba(22,32,60,.16);
--h0:#E6E9F2;--h1:#FCD9B0;--h2:#F5A65B;--h3:#E07A1F;--h4:#A9470A;
--shadow:0 1px 2px rgba(18,22,36,.06),0 8px 24px -12px rgba(18,22,36,.18);--nav:rgba(255,255,255,.9);color-scheme:light}
:root[data-theme=plum]{--bg:#0B030A;--ink:#FFF1F7;--ink2:#F0CFE0;--mute:#C9A3B8;--line:rgba(255,150,200,.16);--line2:rgba(255,160,210,.3);
--card:linear-gradient(155deg,rgba(255,95,140,.16) 0%,rgba(40,10,32,.88) 45%,rgba(26,6,22,.92) 72%,rgba(160,90,255,.14) 100%);--card2:rgba(255,130,190,.08);
--glow:#F7C873;--live:linear-gradient(120deg,#FFD9A0,#F7C873 30%,#FF6F9C 65%,#B26BFF);--grid:rgba(255,170,210,.18);
--h0:rgba(255,150,200,.09);--h1:#5a1a44;--h2:#a3337a;--h3:#ff5f8c;--h4:#F7C873;--nav:rgba(30,6,24,.84)}
:root[data-theme=ocean]{--bg:#021418;--ink:#EAFBFB;--ink2:#C3E9EA;--mute:#8FBFC2;--line:rgba(120,230,230,.15);--line2:rgba(120,230,230,.3);
--card:linear-gradient(155deg,rgba(40,220,200,.14) 0%,rgba(4,36,44,.88) 45%,rgba(3,26,32,.92) 72%,rgba(60,140,255,.14) 100%);--card2:rgba(80,220,220,.08);
--glow:#4BE8E2;--live:linear-gradient(120deg,#D6FFB0,#4BE8E2 40%,#3C8CFF 80%);--grid:rgba(120,230,230,.18);
--h0:rgba(120,230,230,.09);--h1:#0d4f55;--h2:#14918e;--h3:#2fd3c4;--h4:#CFF56E;--nav:rgba(3,26,32,.86)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--f);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
background:radial-gradient(900px 600px at 90% -10%,color-mix(in srgb,var(--h2) 45%,transparent),transparent 60%),radial-gradient(800px 560px at -10% 105%,color-mix(in srgb,var(--cyan) 22%,transparent),transparent 60%),radial-gradient(600px 400px at 50% 120%,color-mix(in srgb,var(--h3) 25%,transparent),transparent 60%)}
:root[data-theme=light] body::before{opacity:.35}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.4}
.app{max-width:1180px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 14px calc(110px + env(safe-area-inset-bottom))}
/* header */
.top{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
.hello{flex:1;min-width:0}
.hello small{display:block;color:var(--mute);font-size:13px}
.hello b{font-size:19px;font-weight:900;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card2);display:grid;place-items:center;cursor:pointer;flex:none;position:relative;transition:transform .2s,border-color .2s}
.ib:hover{border-color:var(--glow)}.ib:active{transform:scale(.92)}
.ib svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.flame{display:flex;align-items:center;gap:4px;padding:0 12px;width:auto;font-weight:900;font-size:16px}
.flame .fi{font-size:19px;filter:drop-shadow(0 0 8px #ff8a3d)}
.flame.off .fi{filter:grayscale(1);opacity:.6}
.flame.on .fi{animation:flick 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.15) rotate(3deg)}}
/* nav */
.nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:2px;padding:7px;border-radius:26px;background:var(--nav);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line2);box-shadow:0 20px 50px -18px rgba(0,0,0,.6);width:min(520px,calc(100% - 20px))}
.nav button{flex:1;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:18px;color:var(--mute);font-size:11.5px;font-weight:700;transition:color .2s,background .2s}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--ink);background:var(--card2)}
.nav button.on svg{stroke:var(--glow)}
.nav .fab{flex:none;width:62px;height:62px;margin:-26px 4px 0;border-radius:50%;background:var(--live);color:#1b1100;box-shadow:0 10px 30px -6px color-mix(in srgb,var(--glow) 70%,transparent),0 0 0 5px var(--bg);justify-content:center}
.nav .fab svg{stroke:#1b1100;width:28px;height:28px}
.nav .fab.run{animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 5px var(--bg),0 0 0 5px color-mix(in srgb,var(--glow) 60%,transparent)}100%{box-shadow:0 0 0 5px var(--bg),0 0 0 22px transparent}}
/* layout */
.view{display:none;animation:vin .45s cubic-bezier(.2,.8,.2,1)}
.view.on{display:block}
@keyframes vin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1050px){.kpis.k6{grid-template-columns:repeat(6,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0}
.card::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(380px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--glow) 12%,transparent),transparent 60%)}
.card:hover::after{opacity:1}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ch h3{font-size:16px;font-weight:900;flex:1;min-width:150px}
.ch .sub{color:var(--mute);font-size:12.5px;width:100%;margin-top:-6px}
.sec-t{font-size:22px;font-weight:900;margin:6px 2px 12px}
.sec-t em{font-style:normal;background:var(--live);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi{padding:14px}
.kpi .l{color:var(--mute);font-size:13px;font-weight:700}
.kpi .v{font-size:30px;font-weight:900;line-height:1.25;margin-top:2px;letter-spacing:-.5px}
.kpi .v small{font-size:13px;font-weight:700;color:var(--mute);margin-inline-start:4px}
.kpi .s{font-size:12.5px;color:var(--ink2);margin-top:2px}
.bar{height:8px;border-radius:9px;background:var(--card2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--live);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.up{color:var(--ok)}.dn{color:var(--bad)}
/* controls */
.btn{border:1px solid var(--line2);background:var(--card2);border-radius:14px;padding:9px 16px;cursor:pointer;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:transform .15s,border-color .2s;white-space:nowrap}
.btn:hover{border-color:var(--glow)}.btn:active{transform:scale(.96)}
.btn.p{background:var(--live);border-color:transparent;color:#1b1100}
.btn.d{color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:11px}
.btn.w{width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:transparent;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--card2);border-color:var(--glow);color:var(--ink)}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.seg{display:inline-flex;background:var(--card2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:4px 11px;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:800;color:var(--mute)}
.seg button.on{background:var(--live);color:#1b1100}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12.5px;color:var(--mute);font-weight:700}
.in,select.in{width:100%;border:1px solid var(--line2);background:color-mix(in srgb,var(--bg) 55%,transparent);border-radius:13px;padding:10px 12px;outline:none;min-width:0}
.in:focus{border-color:var(--glow);box-shadow:0 0 0 3px color-mix(in srgb,var(--glow) 22%,transparent)}
select.in option{background:var(--bg);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>.fld{flex:1 1 130px}
.form{display:grid;gap:10px}
.jd{display:flex;gap:4px}.jd select{padding:10px 6px}
.muted{color:var(--mute)}.small{font-size:12.5px}
.empty{color:var(--mute);text-align:center;padding:22px 8px;font-size:14px}
/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{text-align:right;color:var(--mute);font-weight:800;padding:8px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;background:var(--card2)}
.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.t td.n{font-feature-settings:"tnum";white-space:nowrap;font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px;vertical-align:0}
.x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:8px}
.x:hover{color:var(--bad);background:var(--card2)}
/* charts */
.chart-box{position:relative;cursor:zoom-in}
.chart-box.scroll{overflow-x:auto;cursor:default}
svg.c{display:block;direction:ltr;overflow:visible}
svg.c text{fill:var(--ink2);font-family:var(--f)}
svg.c .ax{font-size:12px;fill:var(--mute)}
svg.c .vl{font-size:12px;font-weight:800;fill:var(--ink)}
svg.c .gridm{stroke:var(--grid);stroke-dasharray:2 4;stroke-width:1}
svg.c .goal{stroke:var(--glow);stroke-dasharray:6 5;stroke-width:1.6}
svg.c rect.b{transform-box:fill-box;transform-origin:50% 100%;animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms);transition:opacity .2s,filter .2s}
svg.c:hover rect.b:not(:hover){opacity:.55}
svg.c rect.b:hover{filter:brightness(1.2)}
svg.c path.ln{stroke-dasharray:var(--L);stroke-dashoffset:var(--L);animation:draw 1.3s ease-out forwards}
svg.c .pt{transition:r .2s}svg.c .pt:hover{r:7}
svg.c .comet{stroke-linecap:round;stroke-width:4;filter:drop-shadow(0 0 6px currentColor);animation:comet 3.6s linear infinite;opacity:0}
@keyframes rise{from{transform:scaleY(.02);opacity:.2}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes comet{0%{stroke-dashoffset:0;opacity:0}10%,85%{opacity:.9}100%{stroke-dashoffset:calc(var(--L) * -1);opacity:0}}
svg.c .hc{transition:transform .15s;transform-box:fill-box;transform-origin:center;animation:pop .5s both;animation-delay:var(--d,0ms)}
svg.c .hc:hover{transform:scale(1.35);stroke:var(--ink);stroke-width:1}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
.zoom-hint{position:absolute;top:0;left:0;font-size:11px;color:var(--mute);background:var(--card2);border-radius:8px;padding:1px 7px;opacity:0;transition:opacity .2s;pointer-events:none}
.chart-box:hover .zoom-hint{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.donut-wrap .legend{flex-direction:column;flex:1;min-width:170px}
.legend .lv{margin-inline-start:auto;font-weight:800;font-feature-settings:"tnum";padding-inline-start:10px}
.legend.col span{display:flex;width:100%}
.hb{display:grid;gap:8px}
.hb .r{display:grid;grid-template-columns:minmax(70px,auto) 1fr 64px;gap:10px;align-items:center;font-size:13.5px}
.hb .tr{height:12px;border-radius:9px;background:var(--card2);overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:9px;transform-origin:right;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
.hb .r b{text-align:left;font-feature-settings:"tnum"}
@keyframes grow{from{transform:scaleX(0)}}
/* tip */
#tip{position:fixed;z-index:90;pointer-events:none;background:color-mix(in srgb,var(--bg) 92%,transparent);border:1px solid var(--line2);color:var(--ink);padding:6px 10px;border-radius:11px;font-size:13px;font-weight:700;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);opacity:0;transition:opacity .15s;max-width:260px;backdrop-filter:blur(8px)}
#tip.on{opacity:1}
/* rings */
.ring-wrap{display:flex;align-items:center;gap:14px}
.ring{position:relative;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;text-align:center;line-height:1.1}
.ring circle.p{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
/* todo */
.todo{display:grid;gap:8px}
.ti{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--card2);border:1px solid var(--line);transition:all .3s}
.ti.done{opacity:.6}
.ti.done .tt{text-decoration:line-through;text-decoration-color:var(--glow)}
.ck{width:28px;height:28px;flex:none;border-radius:10px;border:2px solid var(--line2);display:grid;place-items:center;cursor:pointer;background:none;transition:all .25s}
.ck svg{width:16px;height:16px;stroke:#1b1100;stroke-width:3;fill:none;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s .1s}
.ti.done .ck{background:var(--live);border-color:transparent;transform:rotate(-8deg)}
.ti.done .ck svg{stroke-dashoffset:0}
.ti .tt{flex:1;min-width:0;word-break:break-word;font-weight:700}
.ti .meta{font-size:12px;color:var(--mute);display:block;font-weight:500}
.daynav{display:flex;align-items:center;gap:8px;justify-content:space-between}
.daynav b{font-size:17px;font-weight:900;text-align:center;flex:1}
.daynav b small{display:block;font-size:12px;color:var(--mute);font-weight:600}
/* heat */
.heat-box{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.hl{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--mute);justify-content:flex-end;margin-top:6px}
.hl i{width:13px;height:13px;border-radius:3px;display:inline-block}
/* streak hero */
.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.big-flame{font-size:64px;line-height:1;filter:drop-shadow(0 0 22px #ff7a2f);animation:flick 1.8s ease-in-out infinite}
.big-flame.off{filter:grayscale(1);opacity:.5;animation:none}
.hero .num{font-size:52px;font-weight:900;line-height:1;background:var(--live);-webkit-background-clip:text;background-clip:text;color:transparent}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.bdg{border-radius:18px;padding:12px 10px;text-align:center;background:var(--card2);border:1px solid var(--line);transition:transform .2s}
.bdg .bi{font-size:32px;line-height:1.2}
.bdg b{display:block;font-size:13.5px;margin-top:4px}
.bdg span{font-size:11.5px;color:var(--mute);display:block;line-height:1.5}
.bdg.lock{opacity:.45}.bdg.lock .bi{filter:grayscale(1)}
.bdg:not(.lock){border-color:color-mix(in srgb,var(--glow) 55%,transparent);box-shadow:0 0 24px -12px var(--glow)}
.bdg:not(.lock):hover{transform:translateY(-3px) rotate(-1deg)}
.quote{font-size:16px;font-weight:700;line-height:1.9;border-inline-start:4px solid var(--glow);padding:4px 14px}
.lvl{display:flex;align-items:center;gap:14px}
.lvl .lb{width:64px;height:64px;border-radius:20px;background:var(--live);color:#1b1100;display:grid;place-items:center;font-weight:900;font-size:26px;flex:none;box-shadow:0 10px 30px -10px var(--glow)}
/* insights */
.ins{display:grid;gap:8px}
.ins div{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--card2);font-size:14px}
.ins div i{font-style:normal;font-size:18px;line-height:1.4}
/* sheet & overlay */
.ov{position:fixed;inset:0;z-index:60;background:rgba(2,4,16,.55);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--bg);background-image:var(--card);border:1px solid var(--line2);border-radius:28px 28px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));animation:up .35s cubic-bezier(.2,.8,.2,1)}
@media(min-width:760px){.ov{align-items:center}.sheet{border-radius:28px}}
.sheet.full{width:min(1100px,100%)}
@keyframes up{from{transform:translateY(60px);opacity:.3}}
.sheet .sh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sheet .sh h3{flex:1;font-size:18px;font-weight:900}
.grab{width:46px;height:5px;border-radius:9px;background:var(--line2);margin:-6px auto 10px}
/* timer */
.tm{display:grid;justify-items:center;gap:14px;text-align:center}
.tm .face{position:relative;width:min(290px,78vw);aspect-ratio:1}
.tm .face svg{width:100%;height:100%;transform:rotate(-90deg)}
.tm .face .tv{position:absolute;inset:0;display:grid;place-content:center}
.tm .face .tv b{font-size:clamp(40px,13vw,58px);font-weight:900;font-feature-settings:"tnum";letter-spacing:1px}
.tm .face .tv span{color:var(--mute);font-size:13px}
.tm .face circle.p{transition:stroke-dashoffset 1s linear;filter:drop-shadow(0 0 10px var(--glow))}
.tm.run .face{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.02)}}
.tm .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* login */
.gate{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:var(--bg);overflow:auto}
.gate::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(700px 500px at 80% 0%,color-mix(in srgb,var(--h3) 35%,transparent),transparent 60%),radial-gradient(700px 500px at 10% 100%,color-mix(in srgb,var(--cyan) 25%,transparent),transparent 60%)}
.gate .box{position:relative;width:min(420px,100%);background:var(--card);border:1px solid var(--line2);border-radius:28px;padding:26px 22px;box-shadow:var(--shadow)}
.logo{width:74px;height:74px;border-radius:24px;background:var(--live);display:grid;place-items:center;margin:0 auto 10px;box-shadow:0 14px 40px -12px var(--glow);animation:float 5s ease-in-out infinite}
.logo svg{width:42px;height:42px;stroke:#1b1100;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes float{50%{transform:translateY(-6px) rotate(3deg)}}
.gate h1{text-align:center;font-size:21px;font-weight:900}
.gate p.c{text-align:center;color:var(--mute);margin:2px 0 16px;font-size:13.5px}
.users{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.uc{border:1px solid var(--line2);background:var(--card2);border-radius:16px;padding:8px 14px;cursor:pointer;font-weight:800;display:flex;align-items:center;gap:8px}
.uc.on{border-color:var(--glow);box-shadow:0 0 0 3px color-mix(in srgb,var(--glow) 25%,transparent)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#1b1100;background:var(--live);font-size:14px;flex:none}
.err{color:var(--bad);font-size:13px;min-height:20px;text-align:center;font-weight:700}
.credit{text-align:center;font-size:11.5px;color:var(--mute);margin-top:14px;direction:ltr;letter-spacing:.3px}
.lock-note{font-size:12px;color:var(--mute);text-align:center;margin-top:10px;line-height:1.8}
/* backups */
.bk{display:grid;gap:8px}
.bki{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--card2);border:1px solid var(--line);flex-wrap:wrap}
.bki .bd{flex:1;min-width:180px}
.bki .bd b{display:block;font-size:14px}
.bki .bd span{font-size:12px;color:var(--mute)}
.tag{font-size:11px;font-weight:800;padding:1px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line2);margin-inline-start:6px;white-space:nowrap}
.tag.m{border-color:var(--glow);color:var(--glow)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);z-index:95;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:800;font-size:14px;opacity:0;transition:all .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:96}
.subj-row{display:flex;gap:8px;align-items:center}
.subj-row input[type=color]{width:42px;height:40px;border:1px solid var(--line2);border-radius:12px;background:none;padding:2px;flex:none}
.welcome{text-align:center;padding:24px 16px}
.welcome .bi{font-size:46px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
@media(max-width:420px){.kpi .v{font-size:25px}.card{padding:13px}.app{padding-left:10px;padding-right:10px}.nav button span{font-size:10.5px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* print */
#printArea{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff!important;color:#111}
  body::before,.app,.nav,.ov,.gate,#tip,.toast{display:none!important}
  #printArea{display:block!important}
}

/* Rasa Amozesh brand layer — tokens from docs/01-brand-book.md */
[hidden]{display:none!important}
:root[data-theme=rasa]{--r:18px;--bg:#050505;--ink:#FAFAFA;--ink2:#D9D9D9;--mute:#BCBCBC;--line:#262626;--line2:#414141;
--card:#121212;--card2:#1C1C1C;--glow:#F4D438;--live:linear-gradient(120deg,#FFE66A 0%,#F4D438 60%,#E9C21C 100%);
--ok:#5BD69A;--bad:#FF7A6E;--warn:#FFC765;--cyan:#70DFCC;--violet:#B9A0FF;--grid:#2A2A2A;
--h0:#1C1C1C;--h1:#4A3F0F;--h2:#8A7414;--h3:#C9A91F;--h4:#F4D438;
--shadow:inset 0 1px 0 #ffffff12,0 16px 45px #00000030;--nav:rgba(18,18,18,.9);color-scheme:dark}
:root[data-theme=light]{--r:18px;--bg:#F7F7F7;--ink:#111111;--ink2:#2B2B2B;--mute:#555555;--line:#E2E2E2;--line2:#C9C9C9;
--card:#FFFFFF;--card2:#F1F1F1;--glow:#795B00;--live:linear-gradient(120deg,#FFE66A 0%,#F4D438 70%);
--ok:#0F7A55;--bad:#B3261E;--warn:#8A5A00;--cyan:#0B7C79;--violet:#5A3FCF;--grid:#E4E4E4;
--h0:#EBEBEB;--h1:#F8E9A1;--h2:#F4D438;--h3:#C9A20F;--h4:#795B00;
--shadow:0 1px 2px #0000000d,0 10px 28px -14px #0000002e;--nav:rgba(255,255,255,.94);color-scheme:light}
:root[data-theme=rasa] body::before{background:radial-gradient(900px 520px at 85% -10%,#ffffff0d,transparent 60%),radial-gradient(700px 460px at -10% 110%,#f4d4380f,transparent 60%)}
:root[data-theme=light] body::before{display:none}
:root:is([data-theme=rasa],[data-theme=light]) :is(.btn.p,.seg button.on,.nav .fab,.lvl .lb,.ti.done .ck){color:#080808}
:root:is([data-theme=rasa],[data-theme=light]) .sec-t em{background:none;color:var(--glow)}
:root[data-theme=light] .sec-t em{color:#795B00}
.brand{display:flex;align-items:center;gap:8px;flex:none}
.brand svg{width:38px;height:38px;border-radius:11px}
.gate .logo{background:none!important;box-shadow:none!important}
.gate .logo svg{width:72px;height:72px;stroke:none!important}
.eyb{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px;font-weight:600;margin-bottom:6px}
.eyb::before{content:'';width:22px;height:1px;background:var(--glow)}
.num-i{font-size:12px;color:var(--mute);font-feature-settings:"tnum"}
.hero-r{display:grid;gap:14px;grid-template-columns:1fr auto;align-items:center}
.hero-r h2{font-size:clamp(24px,5.6vw,38px);font-weight:900;line-height:1.45}
.hero-r p{color:var(--mute);margin:6px 0 0;max-width:520px}
.clock{font-feature-settings:"tnum";font-weight:800;color:var(--ink2);font-size:13px}
.ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.blk{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:var(--card2);border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--glow))}
.blk.done{opacity:.55}.blk.done .bt{text-decoration:line-through}
.blk .tm2{font-feature-settings:"tnum";font-weight:800;font-size:13px;min-width:44px;color:var(--ink2)}
.blk .bt{flex:1;min-width:0;font-weight:700;font-size:14px}.blk .bt small{display:block;color:var(--mute);font-weight:500;font-size:12px}
.blk .ck{width:26px;height:26px}
.blk.done .ck{background:var(--live);border-color:transparent}.blk.done .ck svg{stroke-dashoffset:0}
.week{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(272px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.week{align-items:start}.week>.card{scroll-snap-align:start}
.rmrow{flex-basis:100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.rmrow .in{width:auto}.rmrow .chip{padding:2px 9px}
.week .today{border-color:var(--glow)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wh{text-align:center;color:var(--mute);font-size:12px;font-weight:800}
.cal .d{aspect-ratio:1/1.05;border-radius:14px;background:var(--card2);border:1px solid var(--line);padding:5px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;font:inherit;color:inherit;text-align:start}
.cal .d b{font-size:14px;font-weight:900}
.cal .d.t{border-color:var(--glow)}.cal .d.sel{background:var(--glow);color:#080808}.cal .d.sel .dm{color:#080808}
.cal .d .dots{display:flex;gap:3px;flex-wrap:wrap}.cal .d .dots i{width:7px;height:7px;border-radius:50%}
.cal .d .dm{font-size:10.5px;color:var(--mute);margin-top:auto;font-feature-settings:"tnum"}
.cal .d.x0{visibility:hidden}
.prod{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.prod .card{display:flex;flex-direction:column;gap:10px}
.prod .art{height:110px;border-radius:14px;background:var(--card2);border:1px solid var(--line2);display:grid;place-items:center;font-size:42px;color:var(--glow);font-weight:900}
.prod h3{font-size:17px;font-weight:900;line-height:1.6}
.prod p{margin:0;color:var(--mute);font-size:13.5px;line-height:1.9}
.prod .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.price{font-weight:900;color:var(--glow)}
.q{display:grid;gap:8px}
.q .op{border:1px solid var(--line2);background:var(--card2);border-radius:14px;padding:10px 12px;text-align:start;cursor:pointer;font-weight:700}
.q .op.ok{border-color:var(--ok);color:var(--ok)}.q .op.no{border-color:var(--bad);color:var(--bad)}
.q .ex{font-size:13px;color:var(--ink2);background:var(--card2);border-radius:12px;padding:8px 10px}
.qbar{height:6px;border-radius:9px;background:var(--card2);overflow:hidden}.qbar i{display:block;height:100%;background:var(--glow)}
.dayrow{display:grid;grid-template-columns:76px 1fr 1fr;gap:8px;align-items:center}
.credit2{text-align:center;color:var(--mute);font-size:12px;margin:22px 0 4px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
@media (max-width:420px){.cal{gap:4px}.cal .d{padding:3px;border-radius:10px}.cal .d b{font-size:13px}.hero-r{grid-template-columns:1fr}}
#printArea{--ink:#111;--ink2:#333;--mute:#555;--grid:#e3e3e3;--glow:#795B00;--bg:#fff;--card2:#f1f1f1;--line:#ddd;--h0:#eee;--h1:#f8e9a1;--h2:#f4d438;--h3:#c9a20f;--h4:#795b00}

/* ===== crypto vault (AES-256-GCM + PBKDF2-SHA256) ===== */
const te=new TextEncoder(),td=new TextDecoder();

/* ===== IndexedDB key-value (fallback localStorage) ===== */
const KV=(()=>{let dbp=null;const open=()=>dbp||(dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('mst-study',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
